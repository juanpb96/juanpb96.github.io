<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!--
      Self-hosted fonts used above the fold (hero heading and copy). Each is
      a single variable file covering all used weights, so preloading both
      starts the download before src/index.css is even parsed.
    -->
    <link
      rel="preload"
      href="/fonts/instrument-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Juan Bonilla · Front-End Engineer</title>
    <!--
      Static metadata for search engines and link previews. The page is
      client-rendered, so scrapers (LinkedIn, Slack, X) only ever see what is
      in this file. See "index.html" in AGENTS.md for what to keep in sync
      (sameAs is checked by src/test/headMetadata.test.tsx).
    -->
    <meta
      name="description"
      content="Front-end engineer in Bogotá building accessible React and TypeScript interfaces with Claude Code in the loop, verified by hand on desktop and a real phone."
    />
    <link rel="canonical" href="https://juanbonilla.me/" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta
      name="google-site-verification"
      content="_DVbB0xzoO6BDF-LoJ7qSQJkfNq5jpeUvl6lvFFMk1Y"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Juan Bonilla" />
    <meta property="og:title" content="Juan Bonilla · Front-End Engineer" />
    <meta
      property="og:description"
      content="Accessible React and TypeScript interfaces, built with Claude Code in the loop and verified by hand. Projects, experience and contact."
    />
    <meta property="og:url" content="https://juanbonilla.me/" />
    <meta property="og:image" content="https://juanbonilla.me/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Juan Bonilla, Front-End Engineer. juanbonilla.me"
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Juan Bonilla",
        "alternateName": "Juan Pablo Bonilla",
        "url": "https://juanbonilla.me/",
        "jobTitle": "Front-End Engineer",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bogotá",
          "addressCountry": "CO"
        },
        "knowsAbout": [
          "React",
          "TypeScript",
          "Web accessibility",
          "AI-assisted development",
          "Front-end development"
        ],
        "sameAs": [
          "https://www.linkedin.com/in/juanpablobonilla",
          "https://github.com/juanpb96"
        ]
      }
    </script>
    <!--
      Umami Cloud analytics: cookieless, anonymous visit stats. Loaded
      straight from cloud.umami.is (allowed in the CSP in netlify.toml): a
      proxy through Netlify made every visitor show up at Netlify's own
      location. The tracker posts events to gateway.umami.is.
      data-domains keeps deploy previews and localhost out.
    -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="8adcb17c-8fd4-4347-8768-9a2bef690e39"
      data-domains="juanbonilla.me"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms detects a form by parsing the STATIC HTML produced at
      build time — it never runs the client-side bundle, so the real
      contact form (rendered by React inside #root at runtime) is invisible
      to it. This hidden replica exists purely so Netlify's build-time scan
      can register the form name and field names; it mirrors
      src/components/contact/ContactForm.tsx and must be kept in sync with
      it (name="contact", netlify-honeypot="bot-field", and the
      bot-field/name/email/message fields). bot-field is a spam honeypot:
      Netlify drops any submission where it isn't empty.
    -->
    <form
      name="contact"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
