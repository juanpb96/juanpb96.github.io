# Build settings live here (not only in the Netlify UI) so they are reviewed
# and versioned with the code. Netlify runs `pnpm install --frozen-lockfile`
# automatically because pnpm-lock.yaml is present; NODE_VERSION matches the
# "engines" range in package.json and CI's setup-node version.
[build]
command = "pnpm build"
publish = "dist"

[build.environment]
NODE_VERSION = "26"

# Security headers for everything Netlify serves from dist/. They don't apply
# to proxied paths (the redirects below) or to edge-function responses.
# The CSP is enforced after a clean report-only period in production.
# Everything is same-origin except Umami analytics: its script comes from
# cloud.umami.is and it posts events to gateway.umami.is (connect-src keeps
# both hosts). Fonts are self-hosted, the JSON-LD block is data (CSP does
# not apply to it) and React's style={{}} writes through the CSSOM, so no
# 'unsafe-inline' is needed. frame-ancestors covers framing; X-Frame-Options stays for older
# browsers that ignore it.
[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' https://cloud.umami.is https://gateway.umami.is; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
Cross-Origin-Opener-Policy = "same-origin"
X-Frame-Options = "DENY"

# Vite content-hashes everything under /assets/, so it can be cached forever.
# index.html and the unhashed files (fonts, icons) keep Netlify's default
# max-age=0, must-revalidate.
[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# /FEM_weather-app itself is served by netlify/edge-functions/weather-app.ts
[[redirects]]
from = "/FEM_weather-app/*"
to = "https://juanbonilla-fem-weather-app.netlify.app/FEM_weather-app/:splat"
status = 200

[[redirects]]
from = "/*"
to = "https://juanpb96.github.io/:splat"
status = 200
