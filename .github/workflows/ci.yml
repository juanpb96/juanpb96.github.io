name: CI

# Every job is filtered by the `changes` job and aggregated into `ci-ok`,
# the single required status check. Filtering per job (not with a top-level
# `paths:` filter) keeps the required check from staying "pending" forever.
# Add the `full-check` label to a PR, or run the workflow manually, to run
# every job regardless of the changed paths.
#
# Local setup action: `./.github/actions/setup` is used instead of the newer
# `$/` self-repository syntax because actionlint does not understand `$/` yet.
# It runs right after checkout, before any step that could write to the
# workspace, so it always loads the action from the checked-out commit.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate the Playwright snapshot baselines and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ui: ${{ steps.filter.outputs.ui }}
      deps: ${{ steps.filter.outputs.deps }}
      workflows: ${{ steps.filter.outputs.workflows }}
      scripts: ${{ steps.filter.outputs.scripts }}
      links: ${{ steps.filter.outputs.links }}
      e2e: ${{ steps.filter.outputs.e2e }}
      lighthouse: ${{ steps.filter.outputs.lighthouse }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-check') }}
        run: |
          if [ "$FULL" = true ] || [ -z "${GITHUB_BASE_REF:-}" ]; then
            export FULL=true
            git ls-files
          else
            git diff --name-only --no-renames "origin/${GITHUB_BASE_REF}...HEAD"
          fi | bash .github/scripts/ci-changes.sh
          cat "$GITHUB_OUTPUT"

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] -- see note at top

      # Exact versions only (see "Dependency policy" in AGENTS.md).
      - name: No version ranges in package.json
        run: |
          ! grep -nE '"[\^~][0-9]' package.json

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm exec oxfmt --check

      - name: Test
        run: pnpm test

  build:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] -- see note at top

      - name: Build
        run: pnpm build

  dependency-review:
    needs: changes
    if: needs.changes.outputs.deps == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  zizmor:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          inputs: .github
          # Annotations on the PR instead of a SARIF upload, so the job needs
          # no security-events permission.
          advanced-security: false
          annotations: true

  codeql:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # upload CodeQL results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript

  links:
    needs: changes
    if: needs.changes.outputs.links != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # `links` only holds paths limited to [A-Za-z0-9._/@+-] by
      # ci-changes.sh, because lychee-action evals its args.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --base-url https://juanbonilla.me
            --max-retries 3
            --retry-wait-time 5
            --accept 200..=299,429
            --exclude linkedin\.com
            ${{ needs.changes.outputs.links }}
          failIfEmpty: false

  # Browser checks: axe + visual snapshots for the sections a PR can affect.
  # Runs in the official Playwright image so screenshots render the same as
  # the committed baselines; bump the tag and digest together with
  # @playwright/test, then regenerate the baselines (see AGENTS.md).
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e != ''
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    steps:
      # The image has git but not git-lfs; the project images are LFS objects
      # and must be real files, or the screenshots show broken images.
      - name: Install git-lfs
        run: apt-get update && apt-get install -y --no-install-recommends git-lfs

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          lfs: true
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] -- see note at top

      - name: Browser checks
        if: inputs.update-snapshots != true
        env:
          GREP: ${{ needs.changes.outputs.e2e }}
        run: pnpm exec playwright test --grep "$GREP"

      - name: Regenerate snapshot baselines
        if: inputs.update-snapshots == true
        run: pnpm exec playwright test --update-snapshots

      - name: Upload snapshot baselines
        if: inputs.update-snapshots == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-snapshots
          path: e2e/*-snapshots/
          retention-days: 7

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Lighthouse CI against the built site: category scores, Core Web Vitals and
  # a script-size budget, asserted in lighthouserc.json. Reports are kept as a
  # workflow artifact (no public storage upload).
  lighthouse:
    needs: [changes, build]
    if: needs.changes.outputs.lighthouse == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          lfs: true
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] -- see note at top

      - name: Build
        run: pnpm build

      - name: Lighthouse CI
        run: pnpm exec lhci autorun

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          # .lighthouseci is a dot-directory, which upload-artifact skips by
          # default ("No files were found").
          include-hidden-files: true
          retention-days: 7

  ci-ok:
    needs: [changes, static, build, dependency-review, zizmor, codeql, links, e2e, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check needed job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Failed or cancelled jobs: $failed"
            exit 1
          fi
