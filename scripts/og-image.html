<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og-image render</title>
    <!--
      Static template rendered at 1200×630 by scripts/generate-og-image.mjs
      (pnpm run og) to produce public/og-image.png. Re-run when the name/role
      copy below changes. Colors are hardcoded copies of src/tokens.ts so the
      renderer has no module deps; each value comments its token name.
    -->
    <style>
      /* tokens.colors.bg = #0a0b0d */
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #0a0b0d;
      }

      /* Self-hosted subset fonts (public/fonts, generated by pnpm run fonts) */
      @font-face {
        font-family: "Instrument Sans";
        src: url("../public/fonts/instrument-sans.woff2") format("woff2");
        font-weight: 400 700;
        font-display: block;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../public/fonts/jetbrains-mono.woff2") format("woff2");
        font-weight: 400 500;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("../public/fonts/inter.woff2") format("woff2");
        font-weight: 400 500;
        font-display: block;
      }

      /* Architectural grid texture — matches .grid-texture in src/index.css
         (64px lines, tokens.colors.border = rgba(255,255,255,0.07)) at the
         hero's opacity 0.4. */
      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.4;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        background-size: 64px 64px;
        pointer-events: none;
      }

      /* Blue ambient glow — matches HeroSection.tsx: tokens.colors.accentGlow
         rgba(77,156,248,0.08) → transparent 70%, top-right placement */
      .glow {
        position: absolute;
        top: -10%;
        right: -14%;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(77, 156, 248, 0.08) 0%, transparent 70%);
        pointer-events: none;
      }

      /* ~1080×560 centred safe area (LinkedIn/Slack crop edges) */
      .safe {
        position: absolute;
        inset: 35px 60px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: "Instrument Sans", "Inter", sans-serif;
      }

      .monogram {
        /* optional "JB" monogram, top-left */
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border: 1px solid rgba(255, 255, 255, 0.13); /* tokens.colors.borderStrong */
        border-radius: 20px; /* tokens.radius.lg */
        font-family: "Instrument Sans", sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: -0.02em;
        color: #eef0f4; /* tokens.colors.textPrimary */
        background: rgba(77, 156, 248, 0.18); /* tokens.colors.accentDim */
        box-shadow: 0 0 40px rgba(77, 156, 248, 0.08);
      }

      .copy {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .name {
        font-family: "Instrument Sans", sans-serif;
        font-weight: 700;
        font-size: 88px;
        line-height: 1.02;
        letter-spacing: -0.03em; /* tokens.typography.heroTitle.letterSpacing */
        color: #eef0f4; /* tokens.colors.textPrimary */
        margin: 0;
      }

      .role {
        font-family: "Instrument Sans", sans-serif;
        font-weight: 500;
        font-size: 56px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: #8b909a; /* tokens.colors.textSecondary */
        margin: 0;
      }

      .accent {
        font-family: "JetBrains Mono", monospace;
        font-weight: 400;
        font-size: 28px;
        letter-spacing: 0;
        color: #4d9cf8; /* tokens.colors.accent */
        margin: 0;
      }

      .url {
        font-family: "JetBrains Mono", monospace;
        font-weight: 400;
        font-size: 24px;
        color: #8b909a; /* tokens.colors.textSecondary */
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="safe">
      <div class="monogram">JB</div>
      <div class="copy">
        <h1 class="name">Juan Bonilla</h1>
        <p class="role">Front-End Engineer</p>
        <p class="accent">React · TypeScript · Accessibility</p>
      </div>
      <p class="url">juanbonilla.me</p>
    </div>
  </body>
</html>
