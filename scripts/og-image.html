<!doctype html>
<!--
  Open Graph card (1200×630), rendered to public/og-image.png by
  scripts/generate-og-image.mjs (`pnpm run og`). Re-run it when the name or
  role copy changes. It mirrors the hero (title, tags, intro copy) at card
  size. Colours mirror src/tokens.ts (token named next to each
  value); fonts are the self-hosted subsets in public/fonts/, so the text may
  only use characters the site itself renders.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Instrument Sans";
        src: url("../public/fonts/instrument-sans.woff2") format("woff2");
        font-weight: 400 700;
      }

      @font-face {
        font-family: "Inter";
        src: url("../public/fonts/inter.woff2") format("woff2");
        font-weight: 400 500;
      }

      @font-face {
        font-family: "JetBrains Mono";
        src: url("../public/fonts/jetbrains-mono.woff2") format("woff2");
        font-weight: 400 500;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
      }

      body {
        position: relative;
        overflow: hidden;
        background-color: #0a0b0d; /* colors.bg */
        color: #eef0f4; /* colors.textPrimary */
        font-family: "Instrument Sans", sans-serif;
      }

      /* The hero's grid texture: 64px cells in colors.border at 40 %. */
      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.4;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        background-size: 64px 64px;
      }

      /* The hero's ambient glow (colors.accentFaint), scaled up for the card. */
      .glow {
        position: absolute;
        top: -40px;
        right: -60px;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(77, 156, 248, 0.08) 0%,
          transparent 70%
        );
      }

      /* Content stays inside a centred 1080×560 safe area, so previews that
         crop the edges (LinkedIn, Slack) keep everything. */
      .safe {
        position: absolute;
        inset: 35px 60px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .monogram {
        font-weight: 700;
        font-size: 32px;
        letter-spacing: -0.02em;
      }

      /* Same type as the hero title (typography.heroTitle), at card size. */
      .title {
        font-weight: 700;
        font-size: 92px;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }

      .title span {
        display: block;
      }

      .role {
        color: #7b828e; /* colors.textTertiary */
      }

      /* The hero's tags (TagList, accent variant), at card size. */
      .tags {
        display: flex;
        gap: 12px;
        margin-top: 28px;
        padding: 0;
        list-style: none;
      }

      .tags li {
        padding: 6px 18px;
        border: 1px solid rgba(77, 156, 248, 0.3); /* colors.accentBorder */
        border-radius: 999px; /* radius.full */
        background-color: rgba(77, 156, 248, 0.1); /* colors.accentGlow */
        color: #4d9cf8; /* colors.accent */
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        line-height: 29px;
      }

      /* The hero's intro copy (typography.body), at card size. */
      .intro {
        max-width: 880px;
        margin-top: 24px;
        font-family: "Inter", sans-serif;
        font-size: 26px;
        line-height: 1.5;
        color: #8b909a; /* colors.textSecondary */
      }

      .url {
        font-family: "JetBrains Mono", monospace;
        font-size: 24px;
        color: #8b909a; /* colors.textSecondary */
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="safe">
      <p class="monogram">JB</p>
      <div>
        <h1 class="title">
          <span>Juan Bonilla</span>
          <span class="role">Front-End Engineer</span>
        </h1>
        <ul class="tags">
          <li>React</li>
          <li>TypeScript</li>
          <li>AI-assisted workflow</li>
        </ul>
        <p class="intro">
          I build with Claude Code in the loop: it takes the boilerplate, I own
          the design decisions, the accessibility and the final review.
        </p>
      </div>
      <p class="url">juanbonilla.me</p>
    </div>
  </body>
</html>
